name: Generate Pacman Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Menggunakan versi master/main terbaru yang pasti tersedia
      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
