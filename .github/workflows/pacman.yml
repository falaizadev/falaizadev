name: Generate Pacman Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah Resmi 1: Membuat SVG Pacman dan menyimpannya di folder build sementara
      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: falaizadev
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # Langkah Resmi 2: Mengunggah file SVG ke cabang terpisah bernama 'output' menggunakan Token Anda
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
