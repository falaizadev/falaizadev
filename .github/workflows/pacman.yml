name: Generate Pacman Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menggunakan input parameter yang valid dan benar sesuai log
      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: falaizadev
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # Melakukan commit dan push otomatis file SVG yang baru terbuat
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pacman.svg
          git commit -m "Update Pacman Contribution Graph" || exit 0
          git push
