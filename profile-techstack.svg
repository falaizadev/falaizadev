
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="430"
     viewBox="0 0 1200 430"
     fill="none">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg"
                    gradientUnits="userSpaceOnUse"
                    x1="0" y1="0"
                    x2="1200" y2="430">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0B1B30"/>
      <stop offset="100%" stop-color="#10243B"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="cyan"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75D7FF"/>
      <stop offset="100%" stop-color="#3988D8"/>
    </linearGradient>

    <linearGradient id="gold"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE69A"/>
      <stop offset="100%" stop-color="#E5AE4C"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="card"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152C47"/>
      <stop offset="100%" stop-color="#0C1B2E"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#3988D8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#3988D8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clip">
      <rect width="1200" height="430" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

