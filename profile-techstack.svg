    <g stroke="#8BCDF3"
       stroke-opacity=".045"
       stroke-width="1">

      <path d="M0 80H1200"/>
      <path d="M0 160H1200"/>
      <path d="M0 240H1200"/>
      <path d="M0 320H1200"/>

      <path d="M100 0V430"/>
      <path d="M200 0V430"/>
      <path d="M300 0V430"/>
      <path d="M400 0V430"/>
      <path d="M500 0V430"/>
      <path d="M600 0V430"/>
      <path d="M700 0V430"/>
      <path d="M800 0V430"/>
      <path d="M900 0V430"/>
