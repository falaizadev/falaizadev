
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440"
     viewBox="0 0 1200 440"
     fill="none">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050D1B"/>
      <stop offset=".55" stop-color="#0B1B32"/>
      <stop offset="1" stop-color="#102944"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69C8FF"/>
      <stop offset="1" stop-color="#3979D8"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE69A"/>
      <stop offset="1" stop-color="#E8AD43"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142A45"/>
      <stop offset="1" stop-color="#0B192C"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop stop-color="#367CB7" stop-opacity=".19"/>
      <stop offset="1" stop-color="#367CB7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="440" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

    <!-- Background -->
    <rect width="1200" height="440" fill="url(#background)"/>

    <ellipse cx="1040" cy="240" rx="300" ry="250"
             fill="url(#ambient)"/>

    <ellipse cx="180" cy="20" rx="280" ry="180"
             fill="url(#ambient)"/>

    <!-- Background grid -->
    <g stroke="#75BCEB" stroke-opacity=".055" stroke-width="1">
      <path d="M0 80H1200"/>
      <path d="M0 160H1200"/>
      <path d="M0 240H1200"/>
      <path d="M0 320H1200"/>
      <path d="M100 0V440"/>
      <path d="M200 0V440"/>
      <path d="M300 0V440"/>
      <path d="M400 0V440"/>
      <path d="M500 0V440"/>
      <path d="M600 0V440"/>
      <path d="M700 0V440"/>
      <path d="M800 0V440"/>
      <path d="M900 0V440"/>
      <path d="M1000 0V440"/>
      <path d="M1100 0V440"/>
    </g>

    <!-- Decorative orbit -->
    <ellipse cx="1020" cy="220" rx="170" ry="75"
             stroke="#65B9EF" stroke-opacity=".16"
             stroke-width="1.5"
             transform="rotate(-25 1020 220)"/>

    <ellipse cx="1020" cy="220" rx="125" ry="55"
             stroke="#F5CE72" stroke-opacity=".13"
             stroke-width="1"
             transform="rotate(35 1020 220)"/>

    <circle cx="870" cy="180" r="4" fill="#F5CE72"/>
    <circle cx="1140" cy="265" r="3" fill="#69C8FF"/>
    <circle cx="1000" cy="135" r="3" fill="#F5CE72"/>

    <!-- Small stars -->
    <g fill="#D9EDFF">
      <circle cx="70" cy="45" r="1.5"/>
      <circle cx="280" cy="60" r="1"/>
      <circle cx="440" cy="35" r="1.5"/>
      <circle cx="590" cy="75" r="1"/>
      <circle cx="760" cy="45" r="1.5"/>
      <circle cx="1120" cy="70" r="1"/>
      <circle cx="1160" cy="155" r="1.5"/>
      <circle cx="80" cy="350" r="1"/>
      <circle cx="350" cy="390" r="1.5"/>
    </g>

    <!-- Heading -->
    <text x="65" y="65"
          fill="#F5CE72"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12"
          font-weight="700"
          letter-spacing="4">
      GET TO KNOW ME
    </text>

    <text x="65" y="119"
          fill="#F5F8FF"
          font-family="Arial, Helvetica, sans-serif"
          font-size="40"
          font-weight="700"
          letter-spacing="-1.5">
      About Me
    </text>

    <rect x="65" y="137" width="85" height="3"
          rx="2" fill="url(#yellow)"/>

    <text x="65" y="180"
          fill="#FFFFFF"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          font-weight="700">
      Faizal Dwi Ramadhan
    </text>

    <text x="65" y="207"
          fill="#9DB8D2"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13">
      Developer in progress • Indonesia
    </text>

    <text x="65" y="251"
          fill="#D0DFEE"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13">
      I enjoy building digital experiences,
    </text>

    <text x="65" y="273"
          fill="#D0DFEE"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13">
      exploring new technologies, and turning
    </text>

    <text x="65" y="295"
          fill="#D0DFEE"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13">
      ideas into meaningful projects.
    </text>

    <!-- Location -->
    <rect x="65" y="322" width="150" height="32"
          rx="16" fill="#F5CE72" fill-opacity=".08"
          stroke="#F5CE72" stroke-opacity=".35"/>

    <circle cx="83" cy="338" r="4" fill="#F5CE72"/>

    <text x="97" y="342"
          fill="#F5CE72"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="1">
      INDONESIA
    </text>

    <!-- Development card -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="490" y="55" width="295" height="140"
            rx="16" fill="url(#card)"
            stroke="#69C8FF" stroke-opacity=".3"/>

      <circle cx="525" cy="91" r="17"
              fill="#69C8FF" fill-opacity=".12"/>

      <path d="M518 85L511 91L518 97
               M532 85L539 91L532 97"
            stroke="#69C8FF" stroke-width="2"
            stroke-linecap="round"/>

      <text x="554" y="96" fill="#F5CE72"
            font-size="15" font-weight="700">
        Development
      </text>

      <text x="515" y="135" fill="#D0DFEE" font-size="12">
        Building websites and applications
      </text>
      <text x="515" y="155" fill="#D0DFEE" font-size="12">
        while improving my coding skills.
      </text>
      <text x="515" y="178" fill="#69C8FF"
            font-size="10" font-weight="700"
            letter-spacing="1">
        CODE • CREATE • IMPROVE
      </text>
    </g>

    <!-- Exploration card -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="805" y="55" width="330" height="140"
            rx="16" fill="url(#card)"
            stroke="#F5CE72" stroke-opacity=".3"/>

      <circle cx="840" cy="91" r="17"
              fill="#F5CE72" fill-opacity=".12"/>

      <path d="M840 79L844 87L852 91L844 95L840 103L836 95L828 91L836 87Z"
            fill="#F5CE72"/>

      <text x="869" y="96" fill="#F5CE72"
            font-size="15" font-weight="700">
        Exploration
      </text>

      <text x="830" y="135" fill="#D0DFEE" font-size="12">
        Exploring Fullstack Development
      </text>
      <text x="830" y="155" fill="#D0DFEE" font-size="12">
        and Artificial Intelligence.
      </text>
      <text x="830" y="178" fill="#69C8FF"
            font-size="10" font-weight="700"
            letter-spacing="1">
        FULLSTACK + AI
      </text>
    </g>

    <!-- Education card -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="490" y="215" width="295" height="140"
            rx="16" fill="url(#card)"
            stroke="#69C8FF" stroke-opacity=".3"/>

      <circle cx="525" cy="251" r="17"
              fill="#69C8FF" fill-opacity=".12"/>

      <path d="M513 247L525 241L537 247L525 253L513 247Z
