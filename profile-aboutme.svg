            stroke="#69C8FF" stroke-width="1.5"
            stroke-linejoin="round"/>

      <text x="554" y="256" fill="#F5CE72"
            font-size="15" font-weight="700">
        Education
      </text>

      <text x="515" y="295" fill="#D0DFEE" font-size="12">
        High School Student
      </text>
      <text x="515" y="315" fill="#D0DFEE" font-size="12">
        IMPHNEN Member
      </text>
      <text x="515" y="338" fill="#69C8FF"
            font-size="10" font-weight="700"
            letter-spacing="1">
        LEARN EVERY DAY
      </text>
    </g>

    <!-- Current Focus card -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="805" y="215" width="330" height="140"
            rx="16" fill="url(#card)"
            stroke="#F5CE72" stroke-opacity=".3"/>

      <circle cx="840" cy="251" r="17"
              fill="#F5CE72" fill-opacity=".12"/>

      <path d="M840 239L844 247L852 251L844 255L840 263L836 255L828 251L836 247Z"
            stroke="#F5CE72" stroke-width="1.5"
            stroke-linejoin="round"/>

      <text x="869" y="256" fill="#F5CE72"
            font-size="15" font-weight="700">
        Current Focus
      </text>

      <text x="830" y="295" fill="#D0DFEE" font-size="12">
        Preparing for LKS ITSSB
      </text>
      <text x="830" y="315" fill="#D0DFEE" font-size="12">
        Improving problem-solving skills.
      </text>
      <text x="830" y="338" fill="#69C8FF"
            font-size="10" font-weight="700"
            letter-spacing="1">
        KEEP MOVING FORWARD
      </text>
    </g>

    <!-- Footer -->
    <text x="65" y="408"
          fill="#91AFC9"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          font-weight="700"
          letter-spacing="2">
      STILL LEARNING. ALWAYS BUILDING.
    </text>

    <!-- Border -->
    <rect x="1" y="1" width="1198" height="438"
          rx="22" stroke="#8BBCE2"
          stroke-opacity=".22" stroke-width="2"/>

  </g>
</svg>
