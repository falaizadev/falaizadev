
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="310"
     viewBox="0 0 1200 310"
     fill="none">

  <defs>
    <!-- Background -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1B"/>
      <stop offset="55%" stop-color="#0B1B32"/>
      <stop offset="100%" stop-color="#102944"/>
    </linearGradient>

    <!-- Accent colors -->
    <linearGradient id="cyan"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75D7FF"/>
      <stop offset="100%" stop-color="#3979D8"/>
    </linearGradient>

    <linearGradient id="gold"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE69A"/>
      <stop offset="100%" stop-color="#E5AE4C"/>
    </linearGradient>

    <linearGradient id="card"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172F4B"/>
      <stop offset="100%" stop-color="#0C1B2E"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#3988D8" stop-opacity=".17"/>
      <stop offset="100%" stop-color="#3988D8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clip">
      <rect width="1200" height="310" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

    <!-- BACKGROUND -->
    <rect width="1200" height="310" fill="url(#background)"/>

    <ellipse cx="1000" cy="100" rx="300" ry="220"
             fill="url(#ambient)"/>

    <ellipse cx="150" cy="300" rx="250" ry="160"
             fill="url(#ambient)"/>

    <!-- SUBTLE GRID -->
    <g stroke="#8BCDF3"
       stroke-opacity=".045"
       stroke-width="1">
      <path d="M0 80H1200"/>
      <path d="M0 160H1200"/>
      <path d="M0 240H1200"/>

      <path d="M100 0V310"/>
      <path d="M200 0V310"/>
      <path d="M300 0V310"/>
      <path d="M400 0V310"/>
      <path d="M500 0V310"/>
      <path d="M600 0V310"/>
      <path d="M700 0V310"/>
      <path d="M800 0V310"/>
      <path d="M900 0V310"/>
      <path d="M1000 0V310"/>
      <path d="M1100 0V310"/>
    </g>

    <!-- HEADER -->
    <text x="60" y="48"
          fill="#F5CE72"
          font-family="Arial, Helvetica, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="4">
      LET'S CONNECT
    </text>

    <text x="60" y="91"
          fill="#F4F8FF"
          font-family="Arial, Helvetica, sans-serif"
          font-size="34"
          font-weight="700"
          letter-spacing="-1">
      Get in Touch
    </text>

    <text x="60" y="117"
          fill="#9CB5CD"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12">
      Have an idea, project, or opportunity? Let's connect.
    </text>

    <!-- CONNECTION STATUS -->
    <rect x="935" y="61"
          width="205" height="36"
          rx="18"
          fill="#69C8FF"
          fill-opacity=".08"
          stroke="#69C8FF"
          stroke-opacity=".3"/>

    <circle cx="958" cy="79" r="4"
            fill="#72D8A3"/>

    <text x="972" y="83"
          fill="#C7D9EA"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          font-weight="700"
          letter-spacing="1">
      OPEN TO CONNECTIONS
    </text>

    <!-- EMAIL CARD -->
    <g font-family="Arial, Helvetica, sans-serif">

      <rect x="60" y="150"
            width="340" height="92"
            rx="14"
            fill="url(#card)"
            stroke="#69C8FF"
            stroke-opacity=".35"/>

      <rect x="60" y="150"
            width="4" height="92"
            rx="2"
            fill="url(#cyan)"/>

      <circle cx="105" cy="196" r="23"
              fill="#69C8FF"
              fill-opacity=".12"/>

      <!-- Envelope icon -->
      <rect x="94" y="188"
            width="22" height="16"
            rx="3"
            stroke="#75D7FF"
            stroke-width="1.8"/>

      <path d="M95 190L105 198L115 190"
            stroke="#75D7FF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <text x="145" y="190"
            fill="#F4F8FF"
            font-size="16"
            font-weight="700">
        Email
      </text>

      <text x="145" y="213"
            fill="#9CB5CD"
            font-size="11">
        Let's talk about your ideas
      </text>

      <path d="M360 195L367 195M362 190L367 195L362 200"
            stroke="#69C8FF"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- PORTFOLIO CARD -->
    <g font-family="Arial, Helvetica, sans-serif">

      <rect x="430" y="150"
            width="340" height="92"
            rx="14"
            fill="url(#card)"
            stroke="#F5CE72"
            stroke-opacity=".35"/>

      <rect x="430" y="150"
            width="4" height="92"
            rx="2"
            fill="url(#gold)"/>

      <circle cx="475" cy="196" r="23"
              fill="#F5CE72"
              fill-opacity=".12"/>

      <!-- Globe icon -->
      <circle cx="475" cy="196" r="12"
              stroke="#F5CE72"
              stroke-width="1.7"/>

      <path d="M463 196H487
               M475 184
               C468 190 468 202 475 208
               M475 184
               C482 190 482 202 475 208"
            stroke="#F5CE72"
            stroke-width="1.4"
            stroke-linecap="round"/>

      <text x="515" y="190"
            fill="#F4F8FF"
            font-size="16"
            font-weight="700">
        Portfolio
      </text>

      <text x="515" y="213"
            fill="#9CB5CD"
            font-size="11">
        Explore my work and projects
      </text>

      <path d="M730 195L737 195M732 190L737 195L732 200"
            stroke="#F5CE72"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- GITHUB CARD -->
    <g font-family="Arial, Helvetica, sans-serif">

      <rect x="800" y="150"
            width="340" height="92"
            rx="14"
            fill="url(#card)"
            stroke="#69C8FF"
            stroke-opacity=".35"/>

      <rect x="800" y="150"
            width="4" height="92"
            rx="2"
            fill="url(#cyan)"/>

      <circle cx="845" cy="196" r="23"
              fill="#69C8FF"
              fill-opacity=".12"/>

      <!-- GitHub mark -->
      <path d="M845 184
               C838 184 833 189 833 196
               C833 202 837 207 843 208
               V202
               C840 203 838 201 837 198
               C836 195 839 193 839 193
               C837 189 840 188 840 188
               C843 188 844 190 844 190
               C847 189 850 190 850 190
               C851 188 854 188 854 188
               C857 192 854 194 854 194
               C856 198 853 202 848 202
               V208
               C854 207 857 202 857 196
               C857 189 852 184 845 184Z"
            fill="#75D7FF"/>

      <text x="885" y="190"
            fill="#F4F8FF"
            font-size="16"
            font-weight="700">
        GitHub
      </text>

      <text x="885" y="213"
            fill="#9CB5CD"
            font-size="11">
        Check out my repositories
      </text>

      <path d="M1100 195L1107 195M1102 190L1107 195L1102 200"
            stroke="#69C8FF"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- PROFILE VIEWS -->
    <g font-family="Arial, Helvetica, sans-serif">

      <rect x="60" y="263"
            width="220" height="29"
            rx="7"
            fill="#152B43"
            stroke="#8BBCE2"
            stroke-opacity=".22"/>

      <text x="75" y="282"
            fill="#B9CBE0"
            font-size="11">
        PROFILE VIEWS
      </text>

      <rect x="208" y="263"
            width="72" height="29"
            rx="7"
            fill="#3979D8"/>

      <text x="244" y="282"
            fill="#FFFFFF"
            font-size="12"
            font-weight="700"
            text-anchor="middle">
        460
      </text>
    </g>

    <!-- QUOTE -->
    <text x="600" y="281"
          fill="#F0F4FA"
          font-family="Georgia, serif"
          font-size="15"
          font-style="italic"
          text-anchor="middle">
      "Code is like humor. When you have to explain it, it's bad."
    </text>

    <text x="600" y="299"
          fill="#8EA9C3"
          font-family="Arial, Helvetica, sans-serif"
          font-size="9"
          text-anchor="middle"
          letter-spacing="2">
      KEEP CREATING. KEEP CONNECTING.
    </text>

    <!-- BORDER -->
    <rect x="1" y="1"
          width="1198" height="308"
          rx="22"
          stroke="#8BBCE2"
          stroke-opacity=".22"
          stroke-width="2"/>

  </g>
</svg>
